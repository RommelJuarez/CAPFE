<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronto volveremos | Paquio</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FF6F3C, #FF9E3C);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background: rgba(0,0,0,0.4);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #fff;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    a.button {
      display: inline-block;
      text-decoration: none;
      color: #FF6F3C;
      background: #fff;
      padding: 12px 25px;
      border-radius: 50px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    a.button:hover {
      background: #FFBB88;
      color: #fff;
    }

    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #ffe8d1;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pronto volveremos </h1>
    <p>Estamos trabajando en algo increíble para tu negocio. Mientras tanto, puedes conocer nuestra marca y cómo ayudamos a desarrollar sistemas completos y páginas web profesionales.</p>
    <a class="button" href="https://paquio.web.app/" target="_blank">Visitar Paquio</a>
    <footer>
      &copy; 2025 Paquio - Soluciones digitales para tu negocio
    </footer>
  </div>
</body>
</html>
